services:
  playwright:
    build: .
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.auth
    ports:
      - "8080:8080"
      - "9222:9222"
    env_file:
      - .env
    environment:
      - CI=true
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
